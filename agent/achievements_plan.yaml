  "entries": [
    {"id":"Thriving","description":"Reach the colony milestone with the required population, morale and monument.","requirement":"Reach cycle 200; every duplicant has morale at least 16; at least 12 living duplicants; complete all three Great Monument sections.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"ReachedDistantPlanet","description":"Complete the version-specific distant-world victory requirements.","requirement":"Base game: reach the Wormhole destination. Expansion 1 active: establish colonies on 5 asteroids, open the Temporal Tear, and send a craft through it.","requirement_status":"verified","requires_dlc":false,"requires_rocket":true,"requires_multiple_worlds":true,"base_game_feasible":true,"requirement_variants":"Registry selects different requirement lists depending on Expansion 1."},
    {"id":"CollectedArtifacts","description":"Study terrestrial and space artifacts.","requirement":"Study at least 10 terrestrial artifacts and 10 space artifacts at the Artifact Analysis Station.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["EXPANSION1_ID"],"requires_rocket":"TODO_VERIFY","requires_multiple_worlds":"TODO_VERIFY","base_game_feasible":false},
    {"id":"ActivatedGeothermalPlant","description":"Restore and operate the geothermal power plant and clear its blocked vent.","requirement":"Discover the geothermal facility; reconnect the geothermal heat pump; use the plant; clear a blocked geothermal vent.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["DLC2_ID"],"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":false},
    {"id":"Survived100Cycles","description":"Reach the 100-cycle milestone.","requirement":"Reach cycle 100.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"ReachedSpace","description":"Meet the active-version space achievement requirement.","requirement":"Expansion 1 active: launch a craft. Otherwise: reach any space destination.","requirement_status":"verified","requires_dlc":false,"requires_rocket":true,"requires_multiple_worlds":false,"base_game_feasible":true,"requirement_variants":"Registry selects LaunchedCraft with Expansion 1 and ReachedSpace otherwise."},
    {"id":"CompleteSkillBranch","description":"Complete the skill tree branch represented by all terminal skills.","requirement":"Complete all skills returned by the game's terminal-skill list for a skill branch.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"CompleteResearchTree","description":"Complete all research items.","requirement":"ResearchComplete requirement; complete the research tree.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"Clothe8Dupes","description":"Equip eight duplicants with non-default clothing.","requirement":"Equip 8 duplicants in the Outfit slot.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"TameAllBasicCritters","description":"Tame each listed basic critter species in its default morph.","requirement":"Tame Drecko, Hatch, LightBug, Mole, Oilfloater, Pacu, Puft, Moo, Crab, and Squirrel; all listed types are required.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"Build4NatureReserves","description":"Create four Nature Reserve rooms.","requirement":"Build 4 rooms whose type is NatureReserve.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"Minimum20LivingDupes","description":"Have twenty living duplicants at once.","requirement":"At least 20 living duplicants.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"TameAGassyMoo","description":"Tame either supported Moo type.","requirement":"Tame a Moo or DieselMoo; the registry marks these alternatives as not all required.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"CoolBuildingTo6K","description":"Cool a building to 6 Kelvin or below.","requirement":"BuildingComplete.MinKelvinSeen must be at most 6 K.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"EatkCalFromMeatByCycle100","description":"Consume the required calories from listed meat foods before cycle 100.","requirement":"BeforeCycleNumber(100) and consume 400000 calories from the meat food types listed by the registry.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"NoFarmTilesAndKCal","description":"Consume the calorie target without farmable plants.","requirement":"NoFarmables and consume 400000 calories.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"Generate240000kJClean","description":"Generate the clean-energy target without the listed generators.","requirement":"Generate 240000 kJ without MethaneGenerator, PetroleumGenerator, WoodGasGenerator, Generator, or PeatGenerator.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"BuildOutsideStartBiome","description":"Construct a building outside the starting biome.","requirement":"Satisfy the BuildOutsideStartBiome requirement.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"Travel10000InTubes","description":"Accumulate the required duplicant travel distance in transit tubes.","requirement":"Travel 10000 m using NavType.Tube.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"VarietyOfRooms","description":"Build each of the eight registered room types.","requirement":"Build at least one NatureReserve, Hospital, RecRoom, GreatHall, Bedroom, PlumbedBathroom, Farm, and CreaturePen room.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"SurviveOneYear","description":"Reach the one-year cycle milestone.","requirement":"Reach cycle 365.25.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"ExploreOilBiome","description":"Enter the oil-field subzone.","requirement":"Satisfy ExploreOilFieldSubZone.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"EatCookedFood","description":"Eat food produced by an eligible cooking building.","requirement":"Consume 1 calorie from food produced by GourmetCookingStation, CookingStation, Deepfryer, Smoker, or SushiBar.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"BasicPumping","description":"Vent the required mass of oxygen.","requirement":"Vent at least 1000 kg of oxygen.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"BasicComforts","description":"Provide toilets and beds for the duplicant population.","requirement":"At least one FlushToilet or Outhouse per living duplicant, and at least one Bed or LuxuryBed per living duplicant.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"PlumbedWashrooms","description":"Replace the listed basic washroom buildings with their upgraded versions.","requirement":"Upgrade all Outhouses to FlushToilet and all WashBasin buildings to WashSink.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"AutomateABuilding","description":"Automate a building.","requirement":"Satisfy AutomateABuilding.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"MasterpiecePainting","description":"Create a Masterpiece-quality painting with a duplicant who has the Masterworks skill.","requirement":"Satisfy CreateMasterPainting.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"InspectPOI","description":"Inspect a facility ruin to recover its database entry.","requirement":"Satisfy ActivateLorePOI.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"HatchACritter","description":"Hatch one of the eligible critter morphs listed in the registry.","requirement":"Satisfy CritterTypeExists for the registered baby-morph tags.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"CuredDisease","description":"Cure a duplicant of disease.","requirement":"Satisfy CureDisease.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"GeneratorTuneup","description":"Complete one hundred generator tune-ups.","requirement":"Complete 100 PowerTinker tune-up chores on generators.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"ClearFOW","description":"Reveal at least 80% of the asteroid.","requirement":"RevealAsteriod(0.8), i.e. 80% of the measured map area.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"HatchRefinement","description":"Produce the required mass of refined metal through HatchMetal production.","requirement":"Produce at least 10000 kg of HatchMetal poop.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"BunkerDoorDefense","description":"Block a comet with a Bunker Door.","requirement":"Satisfy BlockedCometWithBunkerDoor.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"IdleDuplicants","description":"Have Auto-Sweepers outperform duplicants on deliveries for five cycles.","requirement":"DupesVsSolidTransferArmFetch(1.0, 5): satisfy the registered comparison threshold over 5 cycles.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"ExosuitCycles","description":"For ten consecutive cycles, each duplicant completes an errand while wearing an exosuit.","requirement":"Complete the exosuit chore requirement for 10 cycles.","requirement_status":"verified","requires_dlc":false,"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":true},
    {"id":"FirstTeleport","description":"Teleport a duplicant to another world and defrost a duplicant.","requirement":"TeleportDuplicant and DefrostDuplicant requirements.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["EXPANSION1_ID"],"requires_rocket":false,"requires_multiple_worlds":true,"base_game_feasible":false},
    {"id":"SoftLaunch","description":"Build a launchpad on a world without a teleporter.","requirement":"Satisfy BuildALaunchPad.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["EXPANSION1_ID"],"requires_rocket":false,"requires_multiple_worlds":"TODO_VERIFY","base_game_feasible":false},
    {"id":"GMOOK","description":"Analyze one seed of each registered mutatable plant type.","requirement":"Analyze seeds for the 13 plant IDs registered in the requirement list.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["EXPANSION1_ID"],"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":false},
    {"id":"MineTheGap","description":"Harvest the required mass from space points of interest.","requirement":"Harvest at least 1000000 kg from space POIs.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["EXPANSION1_ID"],"requires_rocket":true,"requires_multiple_worlds":"TODO_VERIFY","base_game_feasible":false},
    {"id":"LandedOnAllWorlds","description":"Land duplicants or rovers on every world in the cluster.","requirement":"Satisfy LandOnAllWorlds for all planetoids in the cluster.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["EXPANSION1_ID"],"requires_rocket":"TODO_VERIFY","requires_multiple_worlds":true,"base_game_feasible":false},
    {"id":"RadicalTrip","description":"Accumulate the required radbolt travel distance.","requirement":"RadBoltTravelDistance(10000), corresponding to a cumulative 10 km.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["EXPANSION1_ID"],"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":false},
    {"id":"SweeterThanHoney","description":"Extract uranium from a Beeta hive without being stung.","requirement":"Satisfy HarvestAHiveWithoutBeingStung.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["EXPANSION1_ID"],"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":false},
    {"id":"SurviveInARocket","description":"Survive in one rocket at the required morale for ten consecutive cycles.","requirement":"SurviveARocketWithMinimumMorale(25, 10): at least 25 morale for 10 cycles.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["EXPANSION1_ID"],"requires_rocket":true,"requires_multiple_worlds":false,"base_game_feasible":false},
    {"id":"RunAReactor","description":"Run a Research Reactor at full capacity for five cycles.","requirement":"RunReactorForXDays(5).","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["EXPANSION1_ID"],"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":false},
    {"id":"EfficientData","description":"Produce a Data Bank using a Data Miner operating at maximum efficiency.","requirement":"Satisfy EfficientDataMiningCheck; the registry description specifies a Data Bank from a maximally efficient Data Miner.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["DLC3_ID"],"requires_rocket":"TODO_VERIFY","requires_multiple_worlds":false,"base_game_feasible":false},
    {"id":"AllTheCircuits","description":"Install eight boosters in one Bionic Duplicant.","requirement":"Satisfy AllTheCircuitsCompleteCheck; the progress text specifies 8 boosters on one Bionic Duplicant.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["DLC3_ID"],"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":false},
    {"id":"AsteroidDestroyed","description":"Defeat the Demolior asteroid before it impacts.","requirement":"DefeatPrehistoricAsteroid; requirement fails if the large impactor has already landed.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["DLC4_ID"],"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":false},
    {"id":"AsteroidSurvived","description":"Survive one hundred cycles after the Demolior impact without duplicant deaths.","requirement":"SurvivedPrehistoricAsteroidImpact(100) and NoDuplicantsCanDie.","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["DLC4_ID"],"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":false},
    {"id":"MinnowRecruited","description":"Complete all three registered Minnow POI identity requirements.","requirement":"Complete the POI_A, POI_B, and POI_C Minnow requirements (their associated deliveries are defined by the game).","requirement_status":"verified","requires_dlc":true,"required_dlc_ids":["DLC5_ID"],"requires_rocket":false,"requires_multiple_worlds":false,"base_game_feasible":false}

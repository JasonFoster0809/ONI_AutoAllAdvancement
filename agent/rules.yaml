{
  "phases": [
    {"id": "early", "start_cycle": 0, "end_cycle": 10, "goals": ["oxygen", "food", "shelter"]},
    {"id": "growth", "start_cycle": 10, "end_cycle": 30, "goals": ["food", "power", "sanitation"]},
    {"id": "midgame", "start_cycle": 30, "end_cycle": 100, "goals": ["power", "automation", "stability"]}
  ],
  "rules": [
    {
      "id": "basic-survival-shortage",
      "priority": 90,
      "when": {"op": "basic_survival_needed"},
      "then": {"skill": "build_basic_survival", "args": {}},
      "cooldown_cycles": 2,
      "pending": 2,
      "requires": ["build_basic_survival"]
    },
    {
      "id": "low-oxygen-setup",
      "priority": 100,
      "when": {"op": "for", "reads": 3, "condition": {"op": "lt", "path": "environment.oxygen_avg_g", "value": 50}},
      "then": {"skill": "build_oxygen_setup", "args": {}},
      "cooldown_cycles": 2,
      "pending": 2,
      "requires": ["build_oxygen_setup"]
    },
    {
      "id": "critical-dupe-hunger",
      "priority": 95,
      "when": {
        "op": "any_item",
        "path": "dupes",
        "where": {"op": "lt", "path": "calories_kcal", "value": 100}
      },
      "then": {"skill": "food_emergency", "args": {}},
      "cooldown_cycles": 1,
      "pending": 1,
      "requires": ["food_emergency"]
    },
    {
      "id": "high-stress",
      "priority": 80,
      "when": {"op": "gte", "path": "dupes.0.stress", "value": 90},
      "then": {"skill": "build_toilet_room", "args": {}},
      "cooldown_cycles": 2,
      "pending": 2,
      "requires": ["build_toilet_room"]
    },
    {
      "id": "deoxidizer-algae-empty",
      "priority": 90,
      "when": {"op": "stored_mass", "building": "MineralDeoxidizer", "state": "built", "element": "Algae", "comparison": "lte", "value": 0},
      "then": {"skill": "build_oxygen_setup", "args": {"existing_machine": true}},
      "cooldown_cycles": 2,
      "pending": 2,
      "requires": ["build_oxygen_setup"]
    },
    {
      "id": "barracks-dupe-unassigned-bed",
      "priority": 85,
      "when": {
        "op": "any_item",
        "path": "dupes",
        "where": {
          "op": "all",
          "conditions": [
            {"op": "eq", "path": "room_type", "value": "Barracks"},
            {"op": "any", "conditions": [
              {"op": "is_null", "path": "bed_x"},
              {"op": "is_null", "path": "bed_y"}
            ]}
          ]
        }
      },
      "then": {"skill": "build_barracks", "args": {"repair_missing_assignment": true}},
      "cooldown_cycles": 2,
      "pending": 2,
      "requires": ["build_barracks"]
    },
    {
      "id": "growth-water-setup",
      "priority": 50,
      "when": {
        "op": "all",
        "conditions": [
          {"op": "gte", "path": "cycle", "value": 10},
          {"op": "lt", "path": "cycle", "value": 30},
          {"op": "any", "conditions": [
            {"op": "count", "building": "LiquidPumpingStation", "comparison": "lt", "value": 1},
            {"op": "count", "building": "WashBasin", "comparison": "lt", "value": 1}
          ]}
        ]
      },
      "then": {"skill": "build_water_setup", "args": {}},
      "cooldown_cycles": 3,
      "pending": 3,
      "requires": ["build_water_setup"]
    },
    {
      "id": "growth-food-basic",
      "priority": 45,
      "when": {
        "op": "all",
        "conditions": [
          {"op": "gte", "path": "cycle", "value": 10},
          {"op": "lt", "path": "cycle", "value": 30},
          {"op": "count", "building": "PlanterBox", "comparison": "lt", "value": 1}
        ]
      },
      "then": {"skill": "build_food_basic", "args": {}},
      "cooldown_cycles": 3,
      "pending": 3,
      "requires": ["build_food_basic"]
    },
    {
      "id": "midgame-recreation",
      "priority": 35,
      "when": {
        "op": "all",
        "conditions": [
          {"op": "gte", "path": "cycle", "value": 30},
          {"op": "lt", "path": "cycle", "value": 100},
          {"op": "count", "building": "MassageTable", "comparison": "lt", "value": 1}
        ]
      },
      "then": {"skill": "build_recreation", "args": {}},
      "cooldown_cycles": 5,
      "pending": 5,
      "requires": ["build_recreation"]
    },
    {
      "id": "midgame-storage-area",
      "priority": 30,
      "when": {
        "op": "all",
        "conditions": [
          {"op": "gte", "path": "cycle", "value": 30},
          {"op": "lt", "path": "cycle", "value": 100},
          {"op": "count", "building": "StorageLocker", "comparison": "lt", "value": 1}
        ]
      },
      "then": {"skill": "build_storage_area", "args": {}},
      "cooldown_cycles": 5,
      "pending": 5,
      "requires": ["build_storage_area"]
    }
  ]
}

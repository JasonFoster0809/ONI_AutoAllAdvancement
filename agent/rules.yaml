{
  "phases": [
    {"id": "early", "start_cycle": 0, "end_cycle": 10, "goals": ["oxygen", "food", "shelter"]},
    {"id": "growth", "start_cycle": 10, "end_cycle": 30, "goals": ["food", "power", "sanitation"]},
    {"id": "midgame", "start_cycle": 30, "end_cycle": 100, "goals": ["power", "automation", "stability"]}
  ],
  "rules": [
    {
      "id": "low-oxygen-setup",
      "priority": 100,
      "when": {"op": "for", "reads": 3, "condition": {"op": "lt", "path": "environment.oxygen_avg_g", "value": 50}},
      "then": {"skill": "build_oxygen_setup", "args": {}},
      "cooldown_cycles": 2,
      "pending": 2,
      "requires": ["build_oxygen_setup"]
    },
    {
      "id": "critical-dupe-hunger",
      "priority": 95,
      "when": {
        "op": "any_item",
        "path": "dupes",
        "where": {"op": "lt", "path": "calories_kcal", "value": 100}
      },
      "then": {"skill": "food_emergency", "args": {}},
      "cooldown_cycles": 1,
      "pending": 1,
      "requires": ["food_emergency"]
    },
    {
      "id": "high-stress",
      "priority": 80,
      "when": {"op": "gte", "path": "dupes.0.stress", "value": 90},
      "then": {"skill": "build_toilet_room", "args": {}},
      "cooldown_cycles": 2,
      "pending": 2,
      "requires": ["build_toilet_room"]
    },
    {
      "id": "deoxidizer-algae-empty",
      "priority": 90,
      "when": {"op": "stored_mass", "building": "MineralDeoxidizer", "state": "built", "element": "Algae", "comparison": "lte", "value": 0},
      "then": {"skill": "build_oxygen_setup", "args": {"existing_machine": true}},
      "cooldown_cycles": 2,
      "pending": 2,
      "requires": ["build_oxygen_setup"]
    },
    {
      "id": "barracks-dupe-unassigned-bed",
      "priority": 85,
      "when": {
        "op": "any_item",
        "path": "dupes",
        "where": {
          "op": "all",
          "conditions": [
            {"op": "eq", "path": "room_type", "value": "Barracks"},
            {"op": "any", "conditions": [
              {"op": "is_null", "path": "bed_x"},
              {"op": "is_null", "path": "bed_y"}
            ]}
          ]
        }
      },
      "then": {"skill": "build_barracks", "args": {"repair_missing_assignment": true}},
      "cooldown_cycles": 2,
      "pending": 2,
      "requires": ["build_barracks"]
    }
  ]
}
